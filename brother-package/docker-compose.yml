services:
  music-manager:
    image: ${IMAGE_NAME:-ghcr.io/jb155/music-manager:latest}
    container_name: music_manager
    restart: unless-stopped
    ports:
      - "${PORT:-8085}:8085"
    environment:
      - MUSIC_DIR=/music
      - NEW_MUSIC_DIR=/music_new
      - BEETSDIR=/config/beets
      - PREVIEW_DIR=/.music_preview
      - PYTHONUNBUFFERED=1
      - OLLAMA_HOST=${OLLAMA_HOST:-}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3.5:9b}
    volumes:
      # Your music collection
      - ${MUSIC_PATH}:/music
      # Staging folder for new downloads
      - ${NEW_MUSIC_PATH}:/music_new
      # Persistent config, tags, and database
      - ${CONFIG_PATH:-./config}:/config
      # Audio preview cache
      - ${PREVIEW_PATH:-./.music_preview}:/.music_preview
    labels:
      # Enable Watchtower automated rolling updates
      - "com.centurylinklabs.watchtower.enable=true"

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower_music
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=3600
      - WATCHTOWER_LABEL_ENABLE=true
    command: --interval 3600
