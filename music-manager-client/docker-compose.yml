services:
  music-manager:
    image: ${IMAGE_NAME:-ghcr.io/jb155/music-manager:latest}
    container_name: music_manager
    restart: unless-stopped
    ports:
      - "${PORT:-8085}:8085"
    environment:
      # Base storage directory: system automatically manages /music, /music_new, /config, etc.
      - STORAGE_DIR=/storage
      - PYTHONUNBUFFERED=1
      - OLLAMA_HOST=${OLLAMA_HOST:-}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3.5:9b}
    volumes:
      # Single base storage: point to any local folder or external drive.
      # Defaults to a './music_data' folder right next to this compose file.
      - ${STORAGE_PATH:-./music_data}:/storage
    labels:
      # Tells Watchtower to automatically update this container when new versions are published
      - "com.centurylinklabs.watchtower.enable=true"

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower_music
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=3600
      - WATCHTOWER_LABEL_ENABLE=true
    command: --interval 3600
